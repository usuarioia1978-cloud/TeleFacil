name: Compilar APK TeleFacil

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Generar archivos base de Android
        run: |
          flutter create . --org com.mifamilia --project-name tele_facil
          cp android/app/src/main/AndroidManifest.xml temp_manifest.xml 2>/dev/null || true
          flutter pub get

      - name: Compilar APK (Release)
        run: flutter build apk --release

      - name: Subir APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: TeleFacil-Instalador
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Subir APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: TeleFacil-Instalador
          path: build/app/outputs/flutter-apk/app-release.apk
